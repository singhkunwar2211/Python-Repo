<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="container max-w-2xl mx-auto bg-white shadow-md rounded-lg p-8">
        <h1 class="text-2xl font-semibold text-blue-600 text-center mb-6">Network Scanner</h1>
        <form method="post" class="mb-6">
            <div class="flex flex-col sm:flex-row gap-4">
                <input
                    type="text"
                    name="ip_range"
                    placeholder="Enter IP range (e.g., 192.168.1.1-192.168.1.254)"
                    required
                    class="w-full sm:w-auto px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                >
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-semibold rounded-md py-2 px-6 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                    Scan Network
                </button>
            </div>
        </form>

        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <strong class="font-bold">Error:</strong>
                <span class="block sm:inline">{{ error }}</span>
            </div>
        {% endif %}

        {% if devices %}
            <div class="overflow-x-auto mb-6">
                <table class="min-w-full leading-normal shadow-md rounded-lg overflow-hidden">
                    <thead class="bg-gray-200 text-gray-700">
                        <tr>
                            <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">IP Address</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">MAC Address</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">Hostname</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">Vendor</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">OS</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white">
                        {% for device in devices %}
                            <tr>
                                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ device.ip }}</td>
                                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ device.mac }}</td>
                                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ device.hostname }}</td>
                                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ device.vendor }}</td>
                                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ device.os }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="flex justify-center gap-4">
                <a href="/download/csv" class="bg-green-500 hover:bg-green-700 text-white font-semibold rounded-md py-2 px-6 shadow-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
                    Download CSV
                </a>
                <a href="/download/json" class="bg-purple-500 hover:bg-purple-700 text-white font-semibold rounded-md py-2 px-6 shadow-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50">
                    Download JSON
                </a>
            </div>
        {% endif %}
    </div>
</body>
</html>
